<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자기소개서 | 이철민</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root { --navy:#223055; --pink:#ffb7ca; --slate:#b0b7c0; --ink:#000; --white:#fff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Pretendard, sans-serif; font-size:15px; line-height:1.43; color:var(--ink); background:var(--white); }
  .wrap { display:grid; grid-template-columns: 1fr 420px; min-height:100vh; }

  /* 왼쪽: 본문 */
  main { display:flex; flex-direction:column; }
  section { padding:48px 60px 30px; }
  h1 { font-size:80px; font-weight:400; line-height:1.2; }
  h2 { font-size:30px; font-weight:500; line-height:1.2; padding-top:24px; border-top:3px solid var(--ink); margin-bottom:24px; }
  .intro { background:var(--navy); color:var(--white); padding-top:60px; padding-bottom:48px; }
  .intro h1 { color:var(--pink); }
  .intro p { margin-top:24px; max-width:640px; }

  .history { background:var(--pink); }
  .history ul { list-style:none; }
  .history li { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--ink); }
  .history li strong { font-weight:500; }

  .pros-cons { background:var(--slate); flex:1; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:30px; }
  .grid2 h3 { font-size:15px; font-weight:500; padding:12px 0; border-top:3px solid var(--ink); border-bottom:1px solid var(--ink); margin-bottom:12px; }

  /* 오른쪽: 이름 */
  aside { background:var(--navy); color:var(--white); position:sticky; top:0; height:100vh;
          display:flex; flex-direction:column; justify-content:space-between; padding:60px; }
  aside .label { font-size:12.75px; font-weight:500; letter-spacing:.1em; color:var(--slate); }
  aside .name { font-size:100px; font-weight:400; line-height:1; color:var(--pink); writing-mode:vertical-rl; align-self:flex-end; }
  aside .foot { font-size:12px; color:var(--slate); border-top:1px solid rgba(255,255,255,.3); padding-top:12px; }

  @media (max-width: 900px) {
    .wrap { grid-template-columns:1fr; }
    aside { order:-1; position:static; height:auto; padding:30px 24px; gap:12px; }
    aside .name { writing-mode:horizontal-tb; align-self:flex-start; font-size:56px; }
    section { padding:30px 24px; }
    h1 { font-size:48px; }
    .grid2 { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <main>
    <section class="intro">
      <h1>자기소개서</h1>
      <p>저는 xx대학교를 졸업했습니다. 여러 대회와 행사에서 쌓은 경험을 바탕으로, 이 회사의 과제를 이렇게 풀어나갈 생각입니다.</p>
    </section>

    <section class="history">
      <h2>이력 · 우승경력</h2>
      <ul>
        <li><strong>xx대회</strong><span>우승 5회</span></li>
        <li><strong>xx경시대회</strong><span>우승 1회</span></li>
        <li><strong>xx경진대회</strong><span>3위</span></li>
        <li><strong>xx페스티벌</strong><span>기획</span></li>
      </ul>
    </section>

    <section class="pros-cons">
      <h2>장단점</h2>
      <div class="grid2">
        <div>
          <h3>장점</h3>
          <p>이러한 능력을 지니고 있어, 문제가 생겼을 때 이렇게 해결해 나갈 수 있습니다.</p>
        </div>
        <div>
          <h3>단점</h3>
          <p>저의 단점은 이러합니다. 그래서 이 단점을 이러한 장점으로 바꾸어 나가고 있습니다.</p>
        </div>
      </div>
    </section>
  </main>

  <aside>
    <span class="label">NAME</span>
    <span class="name">이철민</span>
    <span class="foot">자기소개서 · 2026</span>
  </aside>
</div>
</body>
</html>
